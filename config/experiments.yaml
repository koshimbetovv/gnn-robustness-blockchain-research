global:
  split: test
  attack_only_illicit: true
  only_clean_correct: true
  attack_fraction: 0.02
  seeds: [0, 1, 2]
  models: [gcn, gat, graphsage]

sweeps:
  - attack: fgsm
    params:
      EPS: [0.01, 0.03, 0.05]

  - attack: pgd
    params:
      EPS: [0.03, 0.05]
      STEPS: [10, 30]
      ALPHA: ["auto"]     # auto => 2*eps/steps
      RANDOM_START: [true]

  - attack: node_injection
    params:
      N_INJECT: [1, 3]
      EDGES_PER_INJECTED: [1, 5]
      EPS: [0.03, 0.05]
      STEPS: [30]

  - attack: monti
    params:
      N_INJECT: [5, 10]
      EDGE_BUDGET: [20, 50]
      K_HOP: [1, 2]
      EPS: [0.05]
